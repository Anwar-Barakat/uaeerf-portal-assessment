services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaeerf_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - uaeerf
    depends_on:
      - mssql

  # Payment fulfilment runs on the queue (FulfilPaidOrder), so without a worker
  # every paid registration sits unprocessed and the return page polls forever.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaeerf_queue
    restart: unless-stopped
    working_dir: /var/www
    # queue:listen, not queue:work: it reboots the framework per job, so code
    # changes take effect immediately. queue:work holds the app in memory and
    # silently runs the version it started with - which produced a renewal
    # submitted with empty fields that the database row clearly contained.
    # Use queue:work (and restart it on deploy) in production.
    command: php artisan queue:listen --tries=5 --backoff=10 --sleep=3 --timeout=120
    volumes:
      - ./:/var/www
    networks:
      - uaeerf
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: uaeerf_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - uaeerf
    depends_on:
      - app

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: uaeerf_mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - uaeerf

networks:
  uaeerf:
    driver: bridge

volumes:
  mssql_data:
    driver: local
